name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
          assert.equal(process.env.GITHUB_REF_TYPE, 'tag', 'Publishing requires a tag')
          assert.equal(process.env.GITHUB_REF_NAME, `v${version}`, 'Release tag must match package.json version')
          NODE

      - name: Set up npm with OIDC support
        run: npm install --global npm@11.20.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
          cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install locked public-host fixtures
        run: npm ci --prefix .verification/contracts --no-audit --no-fund

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Check types
        run: pnpm run typecheck

      - name: Build package
        run: pnpm run build

      - name: Run full test suite
        run: pnpm test

      - name: Exercise public host contracts
        run: |
          node .verification/contracts/published-contract.mjs
          node .verification/contracts/interfaces.mjs

      - name: Verify packed release
        run: npm publish --dry-run --access public --ignore-scripts

      - name: Publish to npm with OIDC
        run: npm publish --access public --ignore-scripts

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
